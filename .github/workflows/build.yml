name: Build & Release

on:
  push:
    branches: [master]
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build module
        run: npm run build

      - name: Package for Companion developer modules path
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Directory named "jomboy-dsk" (no version) so user extracts and
          # drops the folder straight into their developer modules path.
          mkdir -p "release/jomboy-dsk"
          cp -r pkg/. "release/jomboy-dsk/"
          cd release
          tar czf "../jomboy-dsk-${VERSION}.tgz" "jomboy-dsk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Jomboy DSK ${{ github.ref_name }}"
          body: |
            ## Install Instructions (Companion v4 — Mac)

            ### Step 1 — Download & extract the module
            1. Download `jomboy-dsk-${{ github.ref_name }}.tgz`
            2. Double-click the file to extract it — you'll get a folder called **`jomboy-dsk`**
            3. Move the `jomboy-dsk` folder somewhere permanent, e.g. `~/Documents/companion-modules/`

            ### Step 2 — Tell Companion where the module is
            1. Open **Bitfocus Companion** → click the **⚙ Settings** button
            2. Find **"Developer modules path"** and set it to the folder containing `jomboy-dsk`
               - Example: `/Users/yourname/Documents/companion-modules`
            3. Click Save / Apply — Companion will reload automatically

            ### Step 3 — Add the connection
            1. Go to the **Connections** tab in Companion
            2. Click **Add connection**
            3. Search for **"Jomboy"** or **"DSK"**
            4. Select **Jomboy Media — OBS Downstream Keyer**
            5. Set Host `127.0.0.1`, Port `4488`
            6. Click Save

            > **Note:** The OBS DSK plugin HTTP server listens on 127.0.0.1 (localhost).
            > Companion must run on the **same machine as OBS**.

            ---
            ### Troubleshooting
            - Module not appearing? Make sure the developer modules path points to the **parent folder** of `jomboy-dsk`, not to `jomboy-dsk` itself.
            - Restart Companion after changing the path if the module doesn't appear immediately.
          files: "*.tgz"
