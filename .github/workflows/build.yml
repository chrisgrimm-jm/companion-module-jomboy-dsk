name: Build & Release

on:
  push:
    branches: [master]
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build module
        run: npm run build

      - name: Package for Companion v4 import
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd pkg
          npm pack --pack-destination ..
          cd ..
          mv *.tgz "jomboy-dsk-${VERSION}.tgz"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Jomboy DSK ${{ github.ref_name }}"
          body: |
            ## Install Instructions (Companion v4)

            1. Download `jomboy-dsk-${{ github.ref_name }}.tgz`
            2. In Companion, open the **Modules** page
            3. Click **Import module package** and select the `.tgz` file
            4. Add a new connection — search **Jomboy** or **DSK**
            5. Set Host `127.0.0.1`, Port `4488`

            > **Note:** The OBS DSK plugin HTTP server listens on 127.0.0.1 (localhost).
            > Companion must run on the **same machine as OBS**.
          files: "*.tgz"
