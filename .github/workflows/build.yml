name: Build & Release

on:
  push:
    branches: [master]
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build module
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$GITHUB_STEP_SUMMARY"

      - name: Package for Companion developer modules path
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Extract to "jomboy-dsk/" (no version) so user drops the folder
          # into their Companion developer modules path.
          mkdir -p "release/jomboy-dsk"
          cp -r pkg/. "release/jomboy-dsk/"
          cd release
          tar czf "../jomboy-dsk-${VERSION}.tgz" "jomboy-dsk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Jomboy DSK ${{ github.ref_name }}"
          body: |
            ## Install Instructions (Companion v4 — Mac)

            ### Step 1 — Download & extract the module
            1. Download `jomboy-dsk-${{ github.ref_name }}.tgz`
            2. Double-click to extract — you get a folder called **`jomboy-dsk`**
            3. Move it somewhere permanent, e.g. `~/Documents/companion-modules/`

            ### Step 2 — Set the Developer modules path in Companion
            1. Open the **Companion launcher** (menu bar icon on Mac)
            2. Click the **⚙ gear / Settings** option
            3. Set **"Developer modules path"** to the folder *containing* `jomboy-dsk`
               - Example: `/Users/yourname/Documents/companion-modules`
            4. Save — Companion reloads

            ### Step 3 — Add the connection
            1. Connections tab → **Add connection**
            2. Search **"Jomboy"** or **"DSK"**
            3. Select **Jomboy Media — OBS Downstream Keyer**
            4. Host: `127.0.0.1`, Port: `4488` → Save

            > OBS must be running with the DSK plugin active on the same Mac.
          files: "*.tgz"
